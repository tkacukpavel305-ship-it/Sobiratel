name: Build Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download project
        uses: actions/checkout@v6

      - name: Extract project ZIP
        run: |
          unzip -q SoBiratel-Android-Project-Fixed.zip -d project
          cd project
          ls -la

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.3.1'

      - name: Build APK
        working-directory: project/SoBiratel
        run: gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SoBiratel-debug-apk
          path: project/SoBiratel/app/build/outputs/apk/debug/app-debug.apk
